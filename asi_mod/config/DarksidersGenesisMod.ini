; Darksiders Genesis Enhanced ASI
; V0.5A test defaults
; Insert opens/closes the in-game overlay by default and can be rebound in the overlay.
; F1-F12 are fixed physical slots; each slot can be reassigned in the overlay.
;
; IMPORTANT:
; All requested features are enabled by default as requested.
; V0.1 overlay foundation is validated in game.
; Current cumulative hooks: rebindable menu key, Toggle HUD, Movement Speed and Action Recovery.

[Overlay]
Enabled=1
MenuKey=Insert

[Features]
ToggleHUD=1
MovementSpeed=1
ActionRecovery=1
SkipIntroVideos=1
ThirdPerson=1

[Values]
MovementSpeedMultiplier=1.150
ActionRecoveryMultiplier=2.000

[Hotkeys]
F1=ToggleHUD
F2=MovementSpeed
F3=ActionRecovery
F4=SkipIntroVideos
F5=ThirdPerson
F6=None
F7=None
F8=None
F9=None
F10=None
F11=None
F12=None
